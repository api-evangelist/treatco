description: 'Treat.co was a consumer gifting e-commerce startup surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network as an
  enrichment lead. As of this enrichment pass the treat.co domain is controlled by
  Mars, Incorporated: it resolves to an AWS Application Load Balancer presenting a
  certificate for alb-redirect.mars.com and returns HTTP 403 on every probed path
  (homepage, /.well-known/security.txt, /api, /developers), with no MX record for
  email. The company therefore exposes no public website, developer portal,
  documentation, or API surface today; it appears dormant or absorbed following
  acquisition. This profile records the domain-security probe and is retained as a
  network lead pending any revived or successor developer surface.'
